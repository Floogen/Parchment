# ─────────────────────────────────────────────────────────────
# Parchment documentation
# ─────────────────────────────────────────────────────────────

site_name: Parchment
site_description: A framework for creating readable books in Stardew Valley.
site_author: Floogen
site_url: https://floogen.github.io/Parchment/

repo_url: https://github.com/Floogen/Parchment
repo_name: Source
edit_uri: edit/main/docs/

copyright: Parchment is a framework mod for Stardew Valley.

exclude_docs: |
  _snippets/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  # Dark is the default. The first entry wins on first visit; the toggle switches
  # between the two and Material remembers the choice in local storage.
  # No prefers-color-scheme media queries here — those would hand the default
  # back to the visitor's OS setting.
  palette:
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs/_snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

# Fail the build on broken cross-references rather than letting them through.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Floogen
      name: Floogen on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Your first book: getting-started/first-book.md
  - Concepts:
      - Units and scale: concepts/units.md
      - Preparing your art: concepts/art.md
      - Layout: concepts/layout.md
      - Conditions: concepts/conditions.md
      - Trigger actions: concepts/actions.md
      - Book indicators: concepts/indicators.md
      - Opening a book: concepts/opening-books.md
  - Reference:
      - Book: reference/book.md
      - Page: reference/page.md
      - Elements:
          - Overview: reference/elements/index.md
          - Title: reference/elements/title.md
          - Heading: reference/elements/heading.md
          - Paragraph: reference/elements/paragraph.md
          - Image: reference/elements/image.md
          - Divider: reference/elements/divider.md
          - Panel: reference/elements/panel.md
          - Banner: reference/elements/banner.md
          - Button: reference/elements/button.md
          - Page number: reference/elements/page-number.md
      - API: reference/api.md
  - Troubleshooting: troubleshooting.md
